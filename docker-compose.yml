version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3.13-management # Use the management image to get the UI
    container_name: vortex-rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"  # Port for AMQP clients
      - "15672:15672" # Port for the management UI
    volumes:
      # Mounts the configuration files into the container
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json
      # Creates a named volume to persist message data across container restarts
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      # Rely on definitions.json and rabbitmq.conf for user setup
      RABBITMQ_NODENAME: rabbit@rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 30s
      retries: 3

volumes:
  # Defines the named volume for data persistence
  rabbitmq_data:
